[tool.ruff]
line-length = 120
target-version = "py313"
# Markdown is documentation, not source. ruff >= 0.14 formats the Python code
# blocks inside .md files, which rewrites hand-aligned snippets in the docs and
# made `make lint-check` fail on main. `ruff check` never looked at .md; only
# the formatter started to. extend-exclude (not exclude) so ruff's default
# exclusions stay in place.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
exclude = [
    ".venv",
    "devtools",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"